[project]
name = "ci-triage"
version = "0.1.0"
description = "Work out why CI failed, and whether it has failed that way before."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
ci-triage = "ci_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_triage"]
